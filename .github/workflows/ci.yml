name: ci

# Provenance: faxforagents/mcp .github/workflows/ci.yml (2026-10-31), actions pinned by SHA.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  truthcheck:
    name: truth pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/truthcheck.sh

  test:
    name: the send flow and a local SDK run against a fake API on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:local
      - name: The input schema is what the Apify CLI accepts
        run: npx -y apify-cli@1.11.0 validate-schema .actor/input_schema.json

  docker:
    name: the Actor image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t faxforagents-send-a-fax .
      - name: Without an input the run fails with the apiKey message, not a crash
        run: |
          set +e
          out=$(docker run --rm faxforagents-send-a-fax 2>&1)
          echo "$out" | tail -5
          echo "$out" | grep -q "apiKey is required"
